name: Apply GPL-3.0-or-later

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-gpl.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply license
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          curl --fail --location --silent --show-error https://www.gnu.org/licenses/gpl-3.0.txt -o LICENSE
          echo "3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986  LICENSE" | sha256sum -c -
          git add LICENSE
          git commit -m "Add GPL-3.0 license text"

          python3 - <<'PY'
          from pathlib import Path
          p = Path("TableFix.jsx")
          text = p.read_text(encoding="utf-8")
          notice = """/*
 * TableFix - table header semantics repair for Adobe InDesign documents
 * Copyright (C) 2026 John Darby
 *
 * This program is free software: you can redistribute it and/or modify
 * it under the terms of the GNU General Public License as published by
 * the Free Software Foundation, either version 3 of the License, or
 * (at your option) any later version.
 *
 * This program is distributed in the hope that it will be useful,
 * but WITHOUT ANY WARRANTY; without even the implied warranty of
 * MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the
 * GNU General Public License for more details.
 *
 * You should have received a copy of the GNU General Public License
 * along with this program.  If not, see <https://www.gnu.org/licenses/>.
 *
 * SPDX-License-Identifier: GPL-3.0-or-later
 */

"""
          if "SPDX-License-Identifier:" not in text:
              p.write_text(notice + text, encoding="utf-8", newline="\n")
          PY
          git add TableFix.jsx
          git commit -m "Add GPL-3.0-or-later notices to source files"

          cat >> README.md <<'EOF'

## License

Copyright (C) 2026 John Darby

TableFix is free software, released under the GNU General Public License,
version 3 or later. You may redistribute and modify it under those terms.
See [LICENSE](LICENSE) for the full text.

This program is distributed in the hope that it will be useful, but WITHOUT
ANY WARRANTY. See the GNU General Public License for details.
EOF
          git add README.md
          git commit -m "Document license in README"

          grep -q "SPDX-License-Identifier: GPL-3.0-or-later" TableFix.jsx
          grep -q "(at your option) any later version." TableFix.jsx
          grep -q "Copyright (C) 2026 John Darby" TableFix.jsx
          ! grep -q "Copyright (C) 2026 Johann Darby" TableFix.jsx
          grep -q "version 3 or later" README.md
          git push origin HEAD:main
